<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CyberSec Command Center: hands-on cybersecurity training with sandboxed labs.">
  <title>Leaderboard | CyberSec Command Center</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/matrix.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body data-page="leaderboard">
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scan-hud" aria-hidden="true"></div>
  <div id="nav"></div>
  <main class="container">

    <h1 class="section-title">leaderboard</h1>
    <p class="mb">XP: +50 per module, +150 per lab flag, +500 per course completed.</p>
    <p id="stats" class="stat-label mb">loading statistics...</p>
    <div class="glass table-wrap">
      <table>
        <thead><tr><th>#</th><th>operator</th><th>xp</th><th>labs</th><th>achievements</th></tr></thead>
        <tbody id="board"><tr><td colspan="5"><div class="loader"></div></td></tr></tbody>
      </table>
    </div>
  </main>
  <footer class="footer">CyberSec Command Center. Practice only on systems you own or are authorized to test.</footer>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/matrix.js"></script>
  <script src="assets/js/terminal.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
